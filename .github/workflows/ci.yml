name: CI

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Install workspace dependencies
        run: npm install
      - name: Validate API and event contracts
        run: |
          # Surface the failing lines as annotations (readable without log access).
          npm run contracts:validate > contracts.log 2>&1 || { grep -iE "error|fail|✗|Error" contracts.log | head -30 | sed 's/^/::error::/'; exit 1; }
      - name: event-contracts unit tests
        working-directory: packages/event-contracts
        run: npm test

  py-common:
    # Pinned: MongoDB's apt repo must publish packages for the runner's Ubuntu release.
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: healuxa
          POSTGRES_PASSWORD: dev
          POSTGRES_DB: outbox_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install MongoDB (native, single-node replica set)
        run: |
          scripts/ci/install-mongodb.sh
          pip install -q "pymongo>=4.13"
          scripts/dev/start-mongodb.sh | tee -a "$GITHUB_ENV"
        env:
          MONGO_DATA_DIR: ${{ runner.temp }}/mongodb
      - name: Install NATS JetStream (native)
        run: scripts/ci/install-nats.sh | tee -a "$GITHUB_ENV"
      - name: Install and test py-common (unit + JetStream/Postgres/Mongo integration)
        env:
          OUTBOX_TEST_DATABASE_URL: postgresql+asyncpg://healuxa:dev@localhost:5432/outbox_test
        run: |
          pip install -e "packages/py-common[dev]"
          test -n "${NATS_URL:-}" && test -n "${MONGODB_URI:-}"
          pytest -q -rs packages/py-common

  ts-common:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Install, build, and test ts-common
        run: |
          npm install
          npm run build -w @healuxa/ts-common
          npm test -w @healuxa/ts-common

  identity-service:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: healuxa
          POSTGRES_PASSWORD: dev
          POSTGRES_DB: healuxa
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Create identity_test database
        env:
          PGPASSWORD: dev
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client > /dev/null
          psql -h localhost -U healuxa -d postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE identity_test;"
      - name: Install packages and identity-service
        run: |
          pip install -e packages/py-common
          pip install -e "services/identity-service[dev]"
      - name: Migrate and test
        env:
          DATABASE_URL: postgresql+asyncpg://healuxa:dev@localhost:5432/identity_test
          REDIS_URL: redis://localhost:6379/0
          NATS_URL: nats://localhost:4222
          PASSWORD_PEPPER: ci-pepper
          MFA_ENCRYPTION_KEY: ci-mfa-key-32bytes-long!!!!!!
          SERVICE_AUTH_CLIENT_ID: healuxa-internal
          SERVICE_AUTH_CLIENT_SECRET: ci-service-secret
        working-directory: services/identity-service
        run: |
          alembic upgrade head
          # Migration reversibility: full downgrade and re-upgrade must succeed.
          alembic downgrade base
          alembic upgrade head
          pytest -q -rs
          python -c "from identity_service.main import app; print('app ok', app.title)"

