          alembic upgrade head
          # Migration reversibility: full downgrade and re-upgrade must succeed.
          alembic downgrade base
          alembic upgrade head
          # Models and migrations must not drift.
          alembic check
          # The exclusive-slot invariant must exist in the database, not only in code.
          PGPASSWORD=dev psql -h localhost -U healuxa -d appointment_test -v ON_ERROR_STOP=1 -Atc \
            "SELECT count(*) FROM pg_constraint WHERE contype = 'x'" | grep -qx 2
