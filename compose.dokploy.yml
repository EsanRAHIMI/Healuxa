      - CMD
      - wget
      - -qO-
      - http://127.0.0.1:8080/health
      interval: 10s
      timeout: 3s
      retries: 10
    depends_on:
      identity-service:
        condition: service_healthy
    build:
      context: .
      dockerfile: infrastructure/production/gateway/Dockerfile
    pull_policy: build
  web:
    restart: unless-stopped
