      WEB_CONCURRENCY: '1'
    expose:
    - '8000'
    depends_on:
      nats:
        condition: service_healthy
      transformation-engine-migrate:
        condition: service_completed_successfully
      identity-service:
        condition: service_healthy
    build:
      context: .
      dockerfile: services/transformation-engine/Dockerfile
    pull_policy: build
