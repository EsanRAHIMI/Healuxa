# Dokploy Git source; Compose Path = ./compose.dokploy.yml
# Required variables: infrastructure/production/dokploy.env.example
# First deployment uses NEW named volumes. Do not apply to a previously initialised database.
# Public domains: web:3000 and gateway:8080 ONLY. Backends/data stay private.
name: healuxa
services:
  postgres:
    image: healuxa/postgres:latest
    restart: unless-stopped
    networks:
    - healuxa
    environment:
      POSTGRES_USER: healuxa_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: healuxa
      IDENTITY_DB_PASSWORD: ${IDENTITY_DB_PASSWORD:?set IDENTITY_DB_PASSWORD}
      TRANSFORMATION_DB_PASSWORD: ${TRANSFORMATION_DB_PASSWORD:?set TRANSFORMATION_DB_PASSWORD}
      PROVIDER_DB_PASSWORD: ${PROVIDER_DB_PASSWORD:?set PROVIDER_DB_PASSWORD}
      APPOINTMENT_DB_PASSWORD: ${APPOINTMENT_DB_PASSWORD:?set APPOINTMENT_DB_PASSWORD}
      CONCIERGE_DB_PASSWORD: ${CONCIERGE_DB_PASSWORD:?set CONCIERGE_DB_PASSWORD}
      NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD:?set NOTIFICATION_DB_PASSWORD}
      PAYMENT_DB_PASSWORD: ${PAYMENT_DB_PASSWORD:?set PAYMENT_DB_PASSWORD}
      SUBSCRIPTION_DB_PASSWORD: ${SUBSCRIPTION_DB_PASSWORD:?set SUBSCRIPTION_DB_PASSWORD}
    volumes:
    - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB
      interval: 5s
      timeout: 5s
      retries: 20
    build:
      context: .
      dockerfile: infrastructure/production/postgres/Dockerfile
    pull_policy: build
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks:
    - healuxa
    command:
    - redis-server
    - --save
    - ''
    - --appendonly
    - 'no'
    - --maxmemory
    - 256mb
    - --maxmemory-policy
    - allkeys-lru
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 5s
      timeout: 3s
      retries: 20
  nats:
    image: nats:2.10-alpine
    restart: unless-stopped
    networks:
    - healuxa
    command:
    - -js
    - -sd
    - /data
    - -m
    - '8222'
    volumes:
    - nats-data:/data
    healthcheck:
      test:
      - CMD
      - wget
      - -qO-
      - http://127.0.0.1:8222/healthz
      interval: 5s
      timeout: 3s
      retries: 20
  identity-service-migrate:
    restart: 'no'
    networks:
    - healuxa
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: '5'
    build:
      context: .
      dockerfile: services/identity-service/Dockerfile
    image: healuxa/identity-service:latest
    entrypoint:
    - alembic
    - upgrade
    - head
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: production
      TENANT_DEFAULT: healuxa-dubai
      LOG_LEVEL: INFO
      NATS_ENABLED: 'true'
      NATS_URL: nats://nats:4222
      REDIS_URL: redis://redis:6379/0
      SERVICE_AUTH_CLIENT_ID: healuxa-internal
      SERVICE_AUTH_CLIENT_SECRET: ${SERVICE_AUTH_CLIENT_SECRET:?set SERVICE_AUTH_CLIENT_SECRET}
      IDENTITY_INTROSPECT_URL: http://identity-service:8001/v1/auth/introspect
      DATABASE_URL: postgresql+asyncpg://hx_identity:${IDENTITY_DB_PASSWORD:?set IDENTITY_DB_PASSWORD}@postgres:5432/identity
      PASSWORD_PEPPER: ${PASSWORD_PEPPER:?set PASSWORD_PEPPER}
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:?set MFA_ENCRYPTION_KEY}
      MFA_ISSUER: Healuxa
      JWT_ISSUER: ${JWT_ISSUER:-https://api.healuxa.ae}
      WEB_CONCURRENCY: '1'
    pull_policy: build
  identity-service:
    restart: unless-stopped
    networks:
    - healuxa
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: '5'
    image: healuxa/identity-service:latest
    environment:
      APP_ENV: production
      TENANT_DEFAULT: healuxa-dubai
      LOG_LEVEL: INFO
      NATS_ENABLED: 'true'
      NATS_URL: nats://nats:4222
      REDIS_URL: redis://redis:6379/0
      SERVICE_AUTH_CLIENT_ID: healuxa-internal
      SERVICE_AUTH_CLIENT_SECRET: ${SERVICE_AUTH_CLIENT_SECRET:?set SERVICE_AUTH_CLIENT_SECRET}
      IDENTITY_INTROSPECT_URL: http://identity-service:8001/v1/auth/introspect
      DATABASE_URL: postgresql+asyncpg://hx_identity:${IDENTITY_DB_PASSWORD:?set IDENTITY_DB_PASSWORD}@postgres:5432/identity
      PASSWORD_PEPPER: ${PASSWORD_PEPPER:?set PASSWORD_PEPPER}
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:?set MFA_ENCRYPTION_KEY}
      MFA_ISSUER: Healuxa
      JWT_ISSUER: ${JWT_ISSUER:-https://api.healuxa.ae}
      WEB_CONCURRENCY: '1'
