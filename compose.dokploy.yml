      DATABASE_URL: postgresql+asyncpg://hx_transformation:${TRANSFORMATION_DB_PASSWORD:?set TRANSFORMATION_DB_PASSWORD}@postgres:5432/transformation
      WEB_CONCURRENCY: '1'
    pull_policy: build
  transformation-engine:
    restart: unless-stopped
    networks:
    - healuxa
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: '5'
    image: healuxa/transformation-engine:latest
    environment:
      APP_ENV: production
      TENANT_DEFAULT: healuxa-dubai
      LOG_LEVEL: INFO
