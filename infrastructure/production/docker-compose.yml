    environment:
      IDENTITY_INTROSPECT_URL: http://identity-service:8001/v1/auth/introspect
      NATS_URL: nats://nats:4222
    expose: ["8021"]
    depends_on:
      nats: { condition: service_healthy }
      concierge-service-migrate: { condition: service_completed_successfully }
      identity-service: { condition: service_healthy }

  notification-service-migrate:
    <<: *service
    restart: "no"
    build: { context: ../.., dockerfile: services/notification-service/Dockerfile }
    image: healuxa/notification-service:latest
    env_file: [env/common.env, env/notification-service.env]
