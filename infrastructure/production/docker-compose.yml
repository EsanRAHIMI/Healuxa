  payment-service:
    <<: *service
    image: healuxa/payment-service:latest
    env_file: [env/common.env, env/payment-service.env]
    environment:
      IDENTITY_INTROSPECT_URL: http://identity-service:8001/v1/auth/introspect
      NATS_URL: nats://nats:4222
      PROVIDER_SERVICE_URL: http://provider-service:8005
    expose: ["8010"]
    depends_on:
      nats: { condition: service_healthy }
      payment-service-migrate: { condition: service_completed_successfully }
      identity-service: { condition: service_healthy }
      provider-service: { condition: service_healthy }

  concierge-service-migrate:
    <<: *service
