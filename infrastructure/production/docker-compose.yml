  transformation-engine-migrate:
    <<: *service
    restart: "no"
    build: { context: ../.., dockerfile: services/transformation-engine/Dockerfile }
    image: healuxa/transformation-engine:latest
    env_file: [env/common.env, env/transformation-engine.env]
    entrypoint: ["alembic", "upgrade", "head"]
    depends_on:
      postgres: { condition: service_healthy }

  transformation-engine:
    <<: *service
    image: healuxa/transformation-engine:latest
    env_file: [env/common.env, env/transformation-engine.env]
    environment:
      IDENTITY_INTROSPECT_URL: http://identity-service:8001/v1/auth/introspect
      NATS_URL: nats://nats:4222
    expose: ["8000"]
    depends_on:
