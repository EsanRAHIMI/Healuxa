# Healuxa API gateway — the single public entry point for every backend service.
#
# Responsibilities:
#   * route /v1/<resource> to the service that owns it (see packages/api-contracts/openapi/*.yaml);
#   * strip client-supplied X-Healuxa-* identity headers, so only bearer tokens (verified by each
#     service against identity-service) can establish identity;
#   * refuse internal-only, service-to-service endpoints and /metrics from the internet;
#   * basic per-IP rate limiting and request-size limits.
# TLS terminates at Dokploy's Traefik in front of this container.

worker_processes auto;
events { worker_connections 4096; }

http {
  server_tokens off;
  access_log /dev/stdout;
  error_log /dev/stderr warn;
  sendfile on;
  keepalive_timeout 65;
  client_max_body_size 2m;

  # Trust Traefik's X-Forwarded-For for the client address (rate limiting, service logs).
  set_real_ip_from 10.0.0.0/8;
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 192.168.0.0/16;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;

  limit_req_zone $binary_remote_addr zone=api:20m rate=20r/s;
  limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;
  limit_req_status 429;

  # Docker's embedded DNS; resolve upstreams at request time so a restarting service does not
  # require a gateway restart.
  resolver 127.0.0.11 valid=10s ipv6=off;

  map $http_upgrade $connection_upgrade { default upgrade; "" close; }

  server {
    listen 8080;

    # Never let a client claim an identity or the edge secret.
    proxy_set_header X-Healuxa-User "";
    proxy_set_header X-Healuxa-Roles "";
    proxy_set_header X-Healuxa-Perms "";
    proxy_set_header X-Healuxa-Tenant "";
    proxy_set_header X-Healuxa-Session "";
    proxy_set_header X-Healuxa-Edge-Secret "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header X-Request-Id $request_id;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_connect_timeout 3s;
    proxy_read_timeout 30s;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    location = /health { access_log off; return 200 "ok\n"; }

    # ── Internal-only (service-to-service) endpoints: never public ──────────────────────
    location = /v1/auth/introspect        { return 404; }
    location = /v1/auth/service-token     { return 404; }
    location ^~ /v1/internal/             { return 404; }
    location ^~ /v1/notifications/send    { return 404; }
    location ^~ /v1/notifications/recipient-links { return 404; }
    location ~ ^/(metrics|v1/metrics)     { return 404; }

    # ── identity-service ─────────────────────────────────────────────────────────────
    location ^~ /v1/auth/ {
      limit_req zone=auth burst=20 nodelay;
      set $up http://identity-service:8001; proxy_pass $up;
    }
    location ^~ /.well-known/   { set $up http://identity-service:8001; proxy_pass $up; }
    location ^~ /v1/sessions    { limit_req zone=api burst=40 nodelay; set $up http://identity-service:8001; proxy_pass $up; }
    location ^~ /v1/iam/        { limit_req zone=api burst=40 nodelay; set $up http://identity-service:8001; proxy_pass $up; }

    # ── appointment-service (slot search lives under /v1/services/{id}/slots) ──────────
    location ~ ^/v1/services/[^/]+/slots$ { limit_req zone=api burst=40 nodelay; set $up http://appointment-service:8007; proxy_pass $up; }
    location ^~ /v1/appointments { limit_req zone=api burst=40 nodelay; set $up http://appointment-service:8007; proxy_pass $up; }

    # ── provider-service ─────────────────────────────────────────────────────────────
    location ~ ^/v1/(providers|facilities|branches|affiliations|availability-rules|services|admin)(/|$) {
      limit_req zone=api burst=60 nodelay;
      set $up http://provider-service:8005; proxy_pass $up;
    }

    # ── payment-service (Stripe webhook must receive the raw body unchanged) ──────────
    location = /v1/payments/webhooks/stripe {
      proxy_request_buffering off;
      set $up http://payment-service:8010; proxy_pass $up;
    }
    location ~ ^/v1/(payments|payment-quotes|invoices)(/|$) { limit_req zone=api burst=40 nodelay; set $up http://payment-service:8010; proxy_pass $up; }

    # ── subscription-service ─────────────────────────────────────────────────────────
    location ~ ^/v1/(subscriptions|plans)(/|$) { limit_req zone=api burst=40 nodelay; set $up http://subscription-service:8009; proxy_pass $up; }

    # ── concierge-service, notification-service ──────────────────────────────────────
    location ^~ /v1/concierge { limit_req zone=api burst=40 nodelay; set $up http://concierge-service:8021; proxy_pass $up; }
    location ~ ^/v1/(notifications|notification-devices)(/|$) { limit_req zone=api burst=60 nodelay; set $up http://notification-service:8022; proxy_pass $up; }

    # ── profile, assessment, transformation ──────────────────────────────────────────
    location ^~ /v1/profiles    { limit_req zone=api burst=40 nodelay; set $up http://profile-service:8002; proxy_pass $up; }
    location ^~ /v1/assessments { limit_req zone=api burst=40 nodelay; set $up http://assessment-service:8003; proxy_pass $up; }
    location ^~ /v1/journeys    { limit_req zone=api burst=40 nodelay; set $up http://transformation-engine:8000; proxy_pass $up; }

    location / { return 404; }
  }
}
