[project]
name = "healuxa-py-common"
version = "3.3.0"
description = "Shared Python utilities for Healuxa services — auth middleware, errors, observability, event envelope."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.7",
    "pydantic-settings>=2.6",
    "prometheus-client>=0.21",
    "python-ulid>=3.0",
]

[project.optional-dependencies]
events = ["nats-py>=2.9"]
events-sql = ["nats-py>=2.9", "sqlalchemy[asyncio]>=2.0", "asyncpg>=0.29"]
events-mongo = ["nats-py>=2.9", "pymongo>=4.13"]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "jsonschema>=4.23",
    "httpx>=0.28",
    "nats-py>=2.9",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "pymongo>=4.13",
]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
