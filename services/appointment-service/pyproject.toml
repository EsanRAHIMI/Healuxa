[project]
name = "appointment-service"
version = "0.1.0"
description = "Healuxa Appointment Service — booking engine: slot derivation, holds, confirmation, lifecycle, reminders"
requires-python = ">=3.12"
dependencies = [
    "healuxa-py-common[events-sql]",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "prometheus-client>=0.21",
    "pydantic-settings>=2.6",
    "python-ulid>=3.0",
    "httpx>=0.28",
    "psycopg[binary]>=3.2",
    # IANA zone data independent of the OS image (slim containers ship without /usr/share/zoneinfo).
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "jsonschema>=4.23",
    "pyyaml>=6.0",
]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
