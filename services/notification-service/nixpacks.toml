# Dokploy Nixpacks alternative to Dockerfile (port 8022).
# Set build context to monorepo root if your Dokploy app path differs.
[phases.setup]
nixPkgs = ["python312"]

[phases.install]
cmds = [
  "pip install -e packages/py-common",
  "pip install -e services/notification-service",
]

[start]
cmd = "cd services/notification-service && uvicorn notification_service.main:app --host 0.0.0.0 --port 8022"
