# Dokploy Nixpacks alternative to Dockerfile (port 8010).
# Set build context to monorepo root if your Dokploy app path differs.
[phases.setup]
nixPkgs = ["python312"]

[phases.install]
cmds = [
  "pip install -e packages/py-common",
  "pip install -e services/payment-service",
]

[start]
cmd = "cd services/payment-service && uvicorn payment_service.main:app --host 0.0.0.0 --port 8010"
