# Dokploy Nixpacks alternative to Dockerfile (port 8005).
# Set build context to monorepo root if your Dokploy app path differs.
[phases.setup]
nixPkgs = ["python312"]

[phases.install]
cmds = [
  "pip install -e packages/py-common",
  "pip install -e services/provider-service",
]

[start]
cmd = "cd services/provider-service && uvicorn provider_service.main:app --host 0.0.0.0 --port 8005"
