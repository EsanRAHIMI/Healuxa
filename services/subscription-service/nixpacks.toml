# Dokploy Nixpacks alternative to Dockerfile (port 8009).
# Set build context to monorepo root if your Dokploy app path differs.
[phases.setup]
nixPkgs = ["python312"]

[phases.install]
cmds = [
  "pip install -e packages/py-common",
  "pip install -e services/subscription-service",
]

[start]
cmd = "cd services/subscription-service && uvicorn subscription_service.main:app --host 0.0.0.0 --port 8009"
